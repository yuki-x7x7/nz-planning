  &lt;details class=&quot;route-reference&quot;&gt;&lt;summary&gt;查看每条路线的顺序与原文备注&lt;/summary&gt;&lt;div id=&quot;nz-route-order&quot;&gt;&lt;section class=&quot;order-item&quot;&gt;&lt;div class=&quot;order-heading&quot;&gt;&lt;span class=&quot;line-swatch route-a&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;A · 截图1 · 7天自驾&lt;/div&gt;&lt;p&gt;奥克兰 → Hahei（教堂湾／热水海滩）→ 霍比屯 → 罗托鲁瓦 → 怀奥塔普 → 陶波 → 汤加里罗 → 遗忘世界公路 → 新普利茅斯 → 三姐妹岩 → 怀托摩 → 奥克兰&lt;/p&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;截图1中的“哈黑”校正为Hahei；D1–4与D5–7合并，保持原攻略其余顺序。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;order-item&quot;&gt;&lt;div class=&quot;order-heading&quot;&gt;&lt;span class=&quot;line-swatch route-b&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;B · 截图2 · 9日安排&lt;/div&gt;&lt;p&gt;奥克兰 → 罗托鲁瓦 → 怀奥塔普 → 惠灵顿 → 飞回奥克兰&lt;/p&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;怀奥塔普／罗托鲁瓦至惠灵顿的交通原文未注明，按节点相连；惠灵顿回奥克兰明确为航班。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;order-item&quot;&gt;&lt;div class=&quot;order-heading&quot;&gt;&lt;span class=&quot;line-swatch route-c&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;C · 截图3 · 约2,000公里自驾&lt;/div&gt;&lt;p&gt;奥克兰 → 陶朗加 → 陶波 → 纳皮尔 → 惠灵顿 → 新普利茅斯 → 哈密尔顿 → 奥克兰&lt;/p&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;霍比屯与蓝泉列在陶朗加和陶波之间，先后未注明；图中用虚线连接。原文标题称7天，住宿建议合计10晚。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;order-item&quot;&gt;&lt;div class=&quot;order-heading&quot;&gt;&lt;span class=&quot;line-swatch route-d&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;D · 文字攻略 · 大巴／局部租车&lt;/div&gt;&lt;p&gt;奥克兰 ↔ 激流岛 → 奥克兰 → 罗托鲁瓦 → 陶波 → 怀托摩 → 奥克兰&lt;/p&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;大巴途经霍比屯停20分钟是原文说法，尚未核实，空心虚线环提示此点；原文日期未与现有机票对齐。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;order-item&quot;&gt;&lt;div class=&quot;order-heading&quot;&gt;&lt;span class=&quot;line-swatch route-e&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;E · 我此前建议 · 约一周自驾&lt;/div&gt;&lt;p&gt;奥克兰 → 怀托摩 → 罗托鲁瓦 → 霍比屯 → 陶波 → 汤加里罗 → 奥克兰&lt;/p&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;汤加里罗高山步道按天气和体力选择；也可改走公园短线。&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;p class=&quot;text-small text-muted source-line&quot;&gt;点击地图地区后，可点下方具体景点查看介绍；下拉菜单含完整目录。市内景点归入城市节点，地图高亮显示所属地区。圆点为城市或景区代表位置，同路段轻微错开。粗线用于行程空间对比，无法作为道路导航或已核实班次。&lt;/p&gt;
  &lt;p class=&quot;text-small text-muted source-line&quot;&gt;底图与主要公路：&lt;a href=&quot;https://www.naturalearthdata.com/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Natural Earth&lt;/a&gt;；坐标：公开地名资料及&lt;a href=&quot;https://www.waikatoregion.govt.nz/assets/WRC/TR201810.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;蓝泉区域报告&lt;/a&gt;。蓝泉／霍比屯先后未明、B跨城交通未明、D霍比屯停靠未核实的部分均用虚线表达。&lt;/p&gt;

    }

  delete frame.dataset.srcdoc;
})();
